<!DOCTYPE html>
<html>
<head>
  <title>Unlayer Editor Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #editor-container {
      height: 600px;
      border: 1px solid #ccc;
    }
    #status {
      padding: 10px;
      background: #f0f0f0;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="status">Loading editor...</div>
  <div id="editor-container"></div>
  
  <script src="//editor.unlayer.com/embed.js"></script>
  <script>
    console.log('Starting Unlayer test...');
    
    // Wait for Unlayer to be available
    function initEditor() {
      if (typeof unlayer === 'undefined') {
        console.log('Waiting for Unlayer...');
        setTimeout(initEditor, 100);
        return;
      }
      
      console.log('Unlayer found, initializing...');
      document.getElementById('status').textContent = 'Initializing editor...';
      
      try {
        unlayer.init({
          id: 'editor-container',
          displayMode: 'email',
          appearance: {
            theme: 'light'
          }
        });
        
        unlayer.addEventListener('editor:ready', function() {
          console.log('Editor ready!');
          document.getElementById('status').textContent = 'Editor ready! Loading template...';
          
          // Load a simple template
          const simpleDesign = {
            body: {
              rows: [{
                cells: [1],
                columns: [{
                  contents: [{
                    type: 'text',
                    values: {
                      containerPadding: '10px',
                      text: '<h1>Welcome to the Email Editor!</h1><p>This is a test template.</p>'
                    }
                  }]
                }]
              }]
            }
          };
          
          unlayer.loadDesign(simpleDesign);
          document.getElementById('status').textContent = 'Editor ready! Template loaded.';
        });
        
      } catch (error) {
        console.error('Error initializing Unlayer:', error);
        document.getElementById('status').textContent = 'Error: ' + error.message;
      }
    }
    
    // Start initialization
    initEditor();
  </script>
</body>
</html>
